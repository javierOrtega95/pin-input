<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>pin-input</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: monospace;
        background: #0d1117;
        margin: 0;
      }

      pin-input::part(wrapper) {
        gap: 8px;
      }

      pin-input::part(slot) {
        width: 48px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 2px solid #30363d;
        color: #e6edf3;
        font-size: 24px;
        box-sizing: border-box;
        outline: none;
      }

      pin-input::part(slot active) {
        border-color: #58a6ff;
        transition: border-color 0.2s ease;
      }
    </style>

    <script type="module" src="/src/pin-input.ts"></script>
  </head>

  <body>
    <!-- only numbers (default) -->
    <pin-input length="6"></pin-input>

    <!-- alphanumeric -->
    <pin-input length="8" pattern="[a-zA-Z0-9]"></pin-input>

    <!-- only uppercase letters -->
    <pin-input length="4" pattern="[A-Z]"></pin-input>

    <!-- autofocus -->
    <pin-input length="6" autofocus></pin-input>
  </body>
</html>
